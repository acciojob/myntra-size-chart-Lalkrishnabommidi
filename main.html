<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
 <title>Size Chart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        table {
            border-collapse: collapse;
            width: 700px;
            margin: 30px auto;
            text-align: center;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        thead {
            background-color: #f5f5f5;
        }

        th {
            font-weight: bold;
            color: #333;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        td {
            color: #555;
        }
    </style>
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
<table border="1">
    <thead>
        <tr>
            <th>Size</th>
            <th>Chest</th>
            <th>Waist</th>
            <th>Hip</th>
            <th>Length</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>XS</td>
            <td>34</td>
            <td>28</td>
            <td>35</td>
            <td>27</td>
        </tr>
        <tr>
            <td>S</td>
            <td>36</td>
            <td>30</td>
            <td>37</td>
            <td>28</td>
        </tr>
        <tr>
            <td>M</td>
            <td>38</td>
            <td>32</td>
            <td>39</td>
            <td>29</td>
        </tr>
        <tr>
            <td>L</td>
            <td>40</td>
            <td>34</td>
            <td>41</td>
            <td>30</td>
        </tr>
        <tr>
            <td>XL</td>
            <td>42</td>
            <td>36</td>
            <td>43</td>
            <td>31</td>
        </tr>
        <tr>
            <td>XXL</td>
            <td>44</td>
            <td>38</td>
            <td>45</td>
            <td>32</td>
        </tr>
    </tbody>
</table>
</body>

</html>
